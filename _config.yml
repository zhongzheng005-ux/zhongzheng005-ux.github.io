# ============================================================
#  Hexo 主配置 —— Eclipse 的博客
#  主题外观请改 _config.butterfly.yml
# ============================================================

# ---------- 站点 ----------
title: Eclipse的博客
subtitle: ''
description: '记录折腾过的东西'
keywords:
author: Eclipse
language: zh-CN

# 时区（GitHub Actions 跑在 UTC，这里固定成北京时间）
timezone: 'Asia/Shanghai'

# ---------- 网址 ----------
# 用户主页站，根路径；不要加子目录
url: https://zhongzheng005-ux.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# ---------- 目录 ----------
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: ':lang'
skip_render:

# ---------- 写作 ----------
new_post_name: ':title.md'
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

# ---------- 代码高亮 ----------
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# ---------- 分类与标签 ----------
default_category: uncategorized
category_map:
tag_map:

# ---------- 日期格式 ----------
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# ---------- 分页 ----------
per_page: 10
pagination_dir: page

# ---------- 主题 ----------
# 从 npm 安装的 hexo-theme-butterfly
theme: butterfly

# ---------- 部署 ----------
# 由 GitHub Actions 负责（见 .github/workflows/pages.yml），这里留空
deploy:
  type: ''
