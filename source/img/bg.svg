<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0%" stop-color="#101a2e"/>
      <stop offset="48%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <radialGradient id="glow1" cx="16%" cy="10%" r="58%">
      <stop offset="0%" stop-color="#5b6cff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#5b6cff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5b6cff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="86%" cy="16%" r="52%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow3" cx="52%" cy="104%" r="58%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.34"/>
      <stop offset="62%" stop-color="#a855f7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="46%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <pattern id="dots" width="112" height="112" patternUnits="userSpaceOnUse" x="28" y="28">
      <circle cx="1" cy="1" r="1.1" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#glow1)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>
  <rect width="1920" height="1080" fill="url(#glow3)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
