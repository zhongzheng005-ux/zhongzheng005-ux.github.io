<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050a16"/>
      <stop offset="55%" stop-color="#080f20"/>
      <stop offset="100%" stop-color="#04070f"/>
    </linearGradient>

    <radialGradient id="aurora1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.42"/>
      <stop offset="60%" stop-color="#0891b2" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="aurora2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="aurora3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.38"/>
      <stop offset="62%" stop-color="#7c3aed" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000008" stop-opacity="0.72"/>
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>

    <filter id="softer" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>

  <!-- 极光带 -->
  <g filter="url(#soft)" opacity="0.95">
    <ellipse cx="420" cy="240" rx="620" ry="280" fill="url(#aurora1)"/>
    <ellipse cx="1180" cy="140" rx="700" ry="240" fill="url(#aurora3)"/>
    <ellipse cx="1500" cy="420" rx="560" ry="300" fill="url(#aurora2)"/>
  </g>

  <g filter="url(#softer)" opacity="0.5">
    <path d="M-100 520 C 320 380, 700 620, 1060 460 S 1700 300, 2040 470"
          fill="none" stroke="#67e8f9" stroke-width="90" stroke-linecap="round" opacity="0.30"/>
    <path d="M-140 700 C 380 560, 780 800, 1180 640 S 1760 520, 2060 700"
          fill="none" stroke="#a78bfa" stroke-width="70" stroke-linecap="round" opacity="0.26"/>
    <path d="M-120 340 C 300 240, 760 420, 1160 300 S 1720 180, 2040 330"
          fill="none" stroke="#34d399" stroke-width="60" stroke-linecap="round" opacity="0.20"/>
  </g>

  <!-- 星点 -->
  <g fill="#ffffff">
    <circle cx="180" cy="120" r="1.6" opacity="0.85"/>
    <circle cx="360" cy="260" r="1.1" opacity="0.6"/>
    <circle cx="540" cy="90" r="1.3" opacity="0.7"/>
    <circle cx="760" cy="210" r="1" opacity="0.5"/>
    <circle cx="980" cy="120" r="1.7" opacity="0.8"/>
    <circle cx="1180" cy="300" r="1.2" opacity="0.6"/>
    <circle cx="1360" cy="170" r="1.5" opacity="0.75"/>
    <circle cx="1560" cy="280" r="1.1" opacity="0.55"/>
    <circle cx="1740" cy="120" r="1.6" opacity="0.8"/>
    <circle cx="240" cy="520" r="1.2" opacity="0.5"/>
    <circle cx="620" cy="640" r="1.4" opacity="0.6"/>
    <circle cx="900" cy="560" r="1" opacity="0.45"/>
    <circle cx="1240" cy="700" r="1.5" opacity="0.65"/>
    <circle cx="1520" cy="600" r="1.2" opacity="0.5"/>
    <circle cx="1820" cy="740" r="1.3" opacity="0.6"/>
    <circle cx="120" cy="880" r="1.4" opacity="0.5"/>
    <circle cx="700" cy="940" r="1.1" opacity="0.4"/>
    <circle cx="1400" cy="880" r="1.3" opacity="0.5"/>
  </g>

  <!-- 细网格 -->
  <g stroke="#7dd3fc" stroke-width="1" opacity="0.045">
    <path d="M0 180 H1920 M0 360 H1920 M0 540 H1920 M0 720 H1920 M0 900 H1920"/>
    <path d="M180 0 V1080 M360 0 V1080 M540 0 V1080 M720 0 V1080 M900 0 V1080 M1080 0 V1080 M1260 0 V1080 M1440 0 V1080 M1620 0 V1080 M1800 0 V1080"/>
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
