<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="45%" stop-color="#050b18"/>
      <stop offset="100%" stop-color="#01030a"/>
    </linearGradient>

    <radialGradient id="neb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="neb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#db2777" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="neb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vg" cx="50%" cy="42%" r="70%">
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </radialGradient>

    <filter id="blur1" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>

    <filter id="blurStar" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#night)"/>

  <g filter="url(#blur1)" opacity="0.95">
    <ellipse cx="380" cy="300" rx="520" ry="380" fill="url(#neb1)"/>
    <ellipse cx="1420" cy="220" rx="480" ry="340" fill="url(#neb2)"/>
    <ellipse cx="1080" cy="820" rx="600" ry="360" fill="url(#neb3)"/>
  </g>

  <!-- 银河带 -->
  <g filter="url(#blur1)" opacity="0.35">
    <path d="M-200 860 C 400 620, 900 520, 1300 380 S 1800 220, 2120 180"
          fill="none" stroke="#c7d2fe" stroke-width="150" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- 星星：大小分层，模拟景深 -->
  <g fill="#ffffff" filter="url(#blurStar)" opacity="0.9">
    <circle cx="90" cy="60" r="2.6"/><circle cx="310" cy="150" r="2.2"/>
    <circle cx="520" cy="40" r="2.8"/><circle cx="740" cy="190" r="2.1"/>
    <circle cx="960" cy="70" r="2.7"/><circle cx="1180" cy="230" r="2.3"/>
    <circle cx="1390" cy="60" r="2.9"/><circle cx="1610" cy="180" r="2.2"/>
    <circle cx="1830" cy="90" r="2.6"/><circle cx="200" cy="420" r="2.4"/>
    <circle cx="640" cy="520" r="2.1"/><circle cx="1020" cy="460" r="2.5"/>
    <circle cx="1480" cy="560" r="2.2"/><circle cx="1750" cy="440" r="2.7"/>
    <circle cx="120" cy="760" r="2.3"/><circle cx="560" cy="880" r="2"/><circle cx="1360" cy="820" r="2.4"/>
  </g>

  <g fill="#ffffff" opacity="0.7">
    <circle cx="60" cy="200" r="1.1"/><circle cx="200" cy="290" r="0.9"/><circle cx="400" cy="120" r="1.2"/>
    <circle cx="470" cy="330" r="1"/><circle cx="610" cy="250" r="1.3"/><circle cx="680" cy="500" r="0.9"/>
    <circle cx="820" cy="140" r="1.1"/><circle cx="880" cy="330" r="1"/><circle cx="1050" cy="200" r="1.2"/>
    <circle cx="1120" cy="380" r="0.9"/><circle cx="1260" cy="120" r="1.1"/><circle cx="1320" cy="340" r="1"/>
    <circle cx="1450" cy="180" r="1.3"/><circle cx="1520" cy="400" r="0.9"/><circle cx="1680" cy="300" r="1.1"/>
    <circle cx="1760" cy="120" r="1"/><circle cx="1880" cy="280" r="1.2"/><circle cx="150" cy="560" r="1"/>
    <circle cx="300" cy="640" r="0.9"/><circle cx="460" cy="720" r="1.1"/><circle cx="700" cy="640" r="0.9"/>
    <circle cx="840" cy="780" r="1"/><circle cx="960" cy="620" r="1.2"/><circle cx="1150" cy="700" r="0.9"/>
    <circle cx="1240" cy="900" r="1.1"/><circle cx="1420" cy="660" r="1"/><circle cx="1560" cy="840" r="0.9"/>
    <circle cx="1700" cy="700" r="1.1"/><circle cx="1840" cy="880" r="1"/><circle cx="80" cy="980" r="1.2"/>
    <circle cx="380" cy="1020" r="0.9"/><circle cx="620" cy="960" r="1"/><circle cx="1000" cy="1000" r="1.1"/>
    <circle cx="1300" cy="1020" r="0.9"/><circle cx="1620" cy="980" r="1"/><circle cx="1900" cy="1000" r="1.1"/>
  </g>

  <rect width="1920" height="1080" fill="url(#vg)"/>
</svg>
